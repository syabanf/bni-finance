# BNI Finance Hub: Postgres, migrasi skema, backend Go, dan frontend nginx.
#
#   docker compose up -d --build
#   docker compose logs -f api
#
# Frontend dan API satu origin di port WEB_PORT (bawaan 8081). Port API_PORT
# tetap dibuka untuk reverse proxy yang sudah menunjuk ke backend langsung.
#
# Rahasia TIDAK ditulis di berkas ini. Semuanya dibaca dari backend/.env, yang
# diabaikan git — lihat backend/.env.example untuk daftar variabelnya.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bni_finance}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres menjalankan berkas di direktori ini hanya saat data directory
      # masih kosong. Perubahan skema berikutnya diterapkan layanan migrate.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Wajib, dan bukan basa-basi: tanpa ini `api` start lebih dulu daripada
      # Postgres siap menerima koneksi, gagal menyambung, lalu keluar.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bni_finance}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Menerapkan db/init.sql setiap kali layanan dinyalakan. Berkas itu idempoten,
  # dan Postgres sendiri hanya menjalankannya pada volume kosong, jadi perubahan
  # skema dulu harus diterapkan dengan tangan sebelum deploy. api baru start
  # setelah langkah ini selesai tanpa galat.
  migrate:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      - psql
      - -h
      - db
      - -U
      - ${POSTGRES_USER:-postgres}
      - -d
      - ${POSTGRES_DB:-bni_finance}
      - -v
      - ON_ERROR_STOP=1
      - -q
      - -f
      - /init.sql
    volumes:
      - ./db/init.sql:/init.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    env_file:
      # Berkas mana yang dipakai bisa ditentukan saat menjalankan:
      #
      #   docker compose up -d                                    # backend/.env
      #   ENV_FILE=backend/.env.production docker compose up -d   # produksi
      #   ENV_FILE=backend/.env.staging    docker compose up -d   # staging
      #
      # required:false supaya `docker compose config` dan build tetap jalan pada
      # clone baru yang belum punya berkas ini. Tanpa itu compose menolak sebelum
      # apa pun sempat dibangun, dengan pesan yang tidak menyebut .env.example.
      - path: ${ENV_FILE:-backend/.env}
        required: false
    environment:
      # Menimpa apa pun yang ada di backend/.env: di dalam jaringan compose,
      # basis datanya bernama `db`, bukan localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bni_finance}?sslmode=disable
      PORT: "8080"
      UPLOAD_DIR: /app/uploads
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Bukti pembayaran harus selamat dari `docker compose down`. Tanpa volume,
      # setiap pembangunan ulang menghapus seluruh lampiran yang pernah diunggah.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
