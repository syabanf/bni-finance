  /api/v1/webhooks/paperid/invoice-amount-due:
    post:
      tags: [Paper.id]
      summary: Callback sisa tagihan invoice
      description: |
        Dipicu saat jumlah tagihan berubah, misalnya setelah pembayaran sebagian.
        
        Saat ini direkam dan diakui saja: melunasi sebagian belum didukung, dan menebak
        akan lebih berbahaya daripada tidak berbuat apa-apa. Rekamannya tersimpan
        lengkap sehingga bisa ditindaklanjuti begitu perilakunya diputuskan.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: |
            Token callback bersama. Bisa juga dikirim lewat header
            `x-paper-callback-token` — Paper.id tidak menandatangani callback,
            jadi token inilah satu-satunya pembuktian asalnya.
