  # ===========================================================================
  # Paper.id
  # ===========================================================================
  /api/v1/invoices/{id}/remind:
    post:
      tags: [Paper.id]
      summary: Kirim ulang invoice sebagai pengingat
      description: |
        **Admin saja.** Mengirim ULANG invoice yang sudah diterbitkan, sehingga
        Paper.id mengantar pesan lagi ke member.

        **Kenapa menerbitkan dokumen baru.** Paper.id tidak punya endpoint
        pengingat. Diperiksa langsung terhadap API staging dengan probe yang
        dikalibrasi lebih dulu (`store-invoice` menjawab 400 karena validasi,
        path ngawur menjawab 404): kedelapan kandidat nama endpoint pengingat
        menjawab 404. Satu-satunya cara membuat Paper.id mengantar pesan lagi
        adalah menerbitkan dokumen lain.

        **Nomornya berbeda, tagihannya sama.** Paper.id membakar nomor secara
        permanen; mengirim ulang dengan nomor yang sama ditolak "nomor sudah
        dipakai". Pengingat memakai nomor turunan `INV-2026-001-R1`, `-R2`, dan
        seterusnya, sementara nomor kanonik invoice tidak berubah sehingga
        rekonsiliasi tetap menunjuk satu tagihan.

        **Konsekuensi yang harus disadari:** setiap pengingat membuat dokumen
        baru di Paper.id untuk tagihan yang sama, jadi member melihat beberapa
        invoice bernominal identik di riwayat Paper.id mereka.

        **Jatuh tempo tidak dihitung ulang** — pengingat atas tunggakan harus
        tetap menampilkan tanggal aslinya, karena memundurkannya membuat
        tunggakan tampak belum jatuh tempo.

        Status invoice TIDAK berubah: yang `overdue` tetap `overdue`. Setiap
        pengingat menambah baris audit `reminded` beserta nomor dokumennya.
      parameters: [{ $ref: "#/components/parameters/InvoiceId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sendEmail:
                  title: Kirim via Email
                  type: boolean
                  description: |
                    Paksa kanal email nyala/mati. Bila tidak dikirim, mengikuti
                    `paperid_send_email` di app_settings.
                sendWhatsApp:
                  title: Kirim via WhatsApp
                  type: boolean
                  description: |
                    Paksa kanal WhatsApp nyala/mati. Bila tidak dikirim,
                    mengikuti `paperid_send_whatsapp` di app_settings.
      responses:
        "200":
          description: Invoice setelah pengingat dikirim (status tidak berubah)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: Member belum punya nomor telepon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Invoice masih draft (pakai Kirim), atau sudah lunas/batal —
            mengingatkan tagihan tertutup berarti menagih orang atas sesuatu
            yang tidak mereka hutangi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Paper.id menolak atau tidak bisa dihubungi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Paper.id belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/invoices/{id}/send:
    post:
      tags: [Paper.id]
      summary: Kirim invoice ke Paper.id
      description: |
        **Admin saja.** Mendorong invoice **draft** ke Paper.id, menyimpan id,
        URL pembayaran (`payper_url`), dan PDF (`pdf_url`) yang dikembalikan,
        lalu memindahkan status ke `sent` — semuanya dalam satu transaksi
        beserta baris audit `sent`.

        `client_id`/`client_secret` Paper.id tidak pernah menyentuh browser;
        seluruh pemanggilan terjadi di server.

        **Kanal pengiriman.** Body opsional. Kanal yang tidak disebutkan
        mengikuti kebijakan operasional di `app_settings`
        (`paperid_send_email`, `paperid_send_whatsapp`) — penerbitan invoice
        terjadi massal, dan bila tiap pemanggil harus menyertakan flagnya, satu
        jalur yang lupa akan berhenti mengantar ke member sambil tetap
        melaporkan sukses.

        **Bawaannya nyala.** Hanya nilai `false` yang mematikan sebuah kanal;
        baris yang belum ada, nilai kosong, maupun kegagalan membaca setting
        tetap mengantar. Invoice yang tidak pernah sampai ke member bukan hasil
        yang lebih ringan — itu kegagalan diam-diam yang tetap dilaporkan
        sukses.

        Member tanpa alamat email dilewati untuk kanal email (WhatsApp tetap
        jalan) — meminta Paper.id mengirim ke alamat kosong pasti ditolak.
        Nomor telepon tetap wajib (dipersyaratkan Paper.id).
      parameters: [{ $ref: "#/components/parameters/InvoiceId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sendEmail:
                  title: Kirim via Email
                  type: boolean
                  description: |
                    Paksa kanal email nyala/mati. Bila tidak dikirim, mengikuti
                    `paperid_send_email` di app_settings.
                sendWhatsApp:
                  title: Kirim via WhatsApp
                  type: boolean
                  description: |
                    Paksa kanal WhatsApp nyala/mati. Bila tidak dikirim,
                    mengikuti `paperid_send_whatsapp` di app_settings.
      responses:
        "200":
          description: Invoice setelah dikirim (status `sent`, field Paper.id terisi)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400":
          description: Member belum punya nomor telepon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Invoice bukan berstatus draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Paper.id menolak atau tidak bisa dihubungi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Paper.id belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/webhooks/paperid/payment-in:
    post:
      tags: [Paper.id]
      summary: Callback pembayaran masuk
      description: |
        Dipanggil Paper.id saat pembayaran masuk mendapat respons balik.
        
        Payloadnya IDENTIK dengan pembayaran keluar — dokumentasi Paper.id menyebutnya
        eksplisit — dan hanya URL pendaftarannya yang membedakan. Itulah sebabnya
        keduanya punya alamat sendiri meski penanganannya sama.
        
        Status dibaca dari `payment_info.status`, dan bila tidak ada di sana, dari objek
        yang dinamai menurut metode pembayaran: `payment_info.bank_transfer.status`,
        `payment_info.qris.status`, `payment_info.credit_card.status`,
        `payment_info.ewallet.status`. Contoh di dashboard Paper.id hanya memuat yang
        bersarang, jadi membaca satu tempat saja membuat separuh payload sah terbaca
        kosong.
        
        Hanya PAID, SETTLED, SUCCESS, SUCCEEDED, dan FULLY_RECONCILED yang melunasi.
        Selainnya diakui dengan 200 tanpa mengubah apa pun.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: |
            Token callback bersama. Bisa juga dikirim lewat header
            `x-paper-callback-token` — Paper.id tidak menandatangani callback,
            jadi token inilah satu-satunya pembuktian asalnya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Callback diterima
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Payload tidak bisa dicocokkan dengan invoice mana pun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Token callback salah atau belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/webhooks/paperid/payment-out:
    post:
      tags: [Paper.id]
      summary: Callback pembayaran keluar
      description: |
        Direkam dan diakui 200. TIDAK melunasi invoice, dan itu keputusan.

        Pembayaran keluar adalah uang yang kita bayarkan, bukan yang kita
        terima — sistem ini hanya menagih iuran keanggotaan dan tidak pernah
        membayar siapa pun. Payload masuk dan keluar IDENTIK menurut
        dokumentasi Paper.id, sehingga URL-nya adalah satu-satunya penanda
        arah. Merutekannya ke penangan yang melunasi berarti membuang penanda
        itu, dan satu callback pembayaran keluar yang kebetulan menyebut nomor
        invoice kita akan menandainya lunas tanpa uang pernah masuk.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: |
            Token callback bersama. Bisa juga dikirim lewat header
            `x-paper-callback-token` — Paper.id tidak menandatangani callback,
            jadi token inilah satu-satunya pembuktian asalnya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Callback diterima
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Payload tidak bisa dicocokkan dengan invoice mana pun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Token callback salah atau belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/webhooks/paperid/invoice-paid:
    post:
      tags: [Paper.id]
      summary: Callback invoice dibayar
      description: |
        Hanya dipicu saat status invoice di Paper.id berubah menjadi `paid`.
        
        Bentuknya BERBEDA dari callback pembayaran: tidak ada `payment_info` sama
        sekali, dan identitas invoicenya ada di `data.invoice.id` serta
        `data.invoice.number`.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: |
            Token callback bersama. Bisa juga dikirim lewat header
            `x-paper-callback-token` — Paper.id tidak menandatangani callback,
            jadi token inilah satu-satunya pembuktian asalnya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Callback diterima
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Payload tidak bisa dicocokkan dengan invoice mana pun
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Token callback salah atau belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/webhooks/paperid/static-va:
    post:
      tags: [Paper.id]
      summary: Callback static VA dan rekonsiliasi email bank
      description: |
        Pembayaran lewat virtual account statis, DAN callback rekonsiliasi —
        keduanya datang lewat bagian ini di dashboard Paper.id.

        Nominal dan statusnya dibaca dari `payment_info.static_va`.
        `FULLY_RECONCILED` melunasi; `PARTIALLY_RECONCILED` sengaja TIDAK —
        tagihannya belum lunas, dan menandainya lunas akan menghentikan
        penagihan atas sisa yang masih terutang.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          schema: { type: string }
          description: |
            Token callback bersama. Bisa juga dikirim lewat header
            `x-paper-callback-token` — Paper.id tidak menandatangani callback,
            jadi token inilah satu-satunya pembuktian asalnya.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Callback diterima
