openapi: 3.1.0

info:
  title: BNI Finance API
  version: "1.0.0"
  description: |
    REST API untuk BNI — invoice keanggotaan
    (pendaftaran & renewal), pembayaran, member, chapter, dan pelaporan.

    ## Autentikasi

    Semua endpoint `/api/v1/**` butuh token, **kecuali** yang ditandai
    `security: []` — login, halaman bayar publik, dan webhook.

    ```
    Authorization: Bearer <token>
    ```

    Token didapat dari `POST /api/v1/auth/login` dan berlaku 12 jam (bisa
    diubah lewat `TOKEN_TTL`). Tidak ada sesi di server: token yang sudah
    diterbitkan berlaku sampai kedaluwarsa, jadi keluar (logout) cukup dengan
    membuang token di sisi klien.

    ## Peran

    | Peran | Boleh |
    |---|---|
    | `admin` | Semuanya |
    | `user` | Hanya **pembacaan** (`GET`) |

    Setiap penulisan oleh peran `user` dibalas **403**. Ini batas yang
    sebenarnya — cek peran di UI hanya menyembunyikan tombol.

    ## Bentuk respons

    Daftar selalu memakai amplop yang sama:

    ```json
    { "data": [ … ], "meta": { "total": 47, "limit": 50, "offset": 0 } }
    ```

    `data` selalu larik — tidak pernah `null` — meski kosong.
    Galat selalu `{ "error": "pesan dalam Bahasa Indonesia" }`.

    Seluruh field JSON memakai **camelCase**, sama persis dengan tipe di
    `src/types`, sehingga bisa dipakai klien TypeScript tanpa lapisan pemetaan.

  license:
    name: Internal — BNI

servers:
  - url: http://localhost:8080
    description: Pengembangan lokal

tags:
  - name: Auth
    description: Login, profil, dan pengelolaan pengguna
  - name: Invoice
    description: CRUD invoice beserta jejak auditnya
  - name: Pembayaran
    description: Pencatatan pembayaran; mencatat = melunasi invoice
  - name: Member
    description: Anggota chapter, termasuk yang mendekati jatuh tempo renewal
  - name: Chapter
    description: Chapter BNI
  - name: Pengaturan
    description: Biaya keanggotaan dan konfigurasi aplikasi
  - name: Dashboard
    description: Agregat KPI, hanya baca
  - name: Unggahan
    description: Bukti pembayaran
  - name: Sinkronisasi
    description: Tarik data member & chapter dari BNI Visitor Management
  - name: Paper.id
    description: Kirim invoice ke Paper.id & terima callback pembayaran
  - name: Blackbox
    description: Rekaman lalu lintas integrasi (Paper.id, Xendit, BNI VM)
  - name: Publik
    description: Dapat diakses tanpa token — pembayar bukan pengguna aplikasi
  - name: Sistem
    description: Kesehatan layanan dan dokumentasi

security:
  - bearerAuth: []

paths:
  # ===========================================================================
  # Auth
  # ===========================================================================
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Masuk dan dapatkan token
      description: |
        Email dibandingkan tanpa membedakan huruf besar/kecil.

        Email tak dikenal dan kata sandi salah menghasilkan **pesan yang sama
        persis** dan waktu pemrosesan yang setara — akun tidak bisa dienumerasi
        lewat endpoint ini.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
            example: { email: "admin@bnifinance.local", password: "rahasia" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Email atau kata sandi salah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "email atau kata sandi salah" }

  /api/v1/auth/quick-login:
    get:
      tags: [Auth]
      summary: Daftar akun masuk cepat
      description: |
        Akun yang boleh masuk **tanpa kata sandi**, untuk demo dan pengembangan
        lokal. Hanya nama, email, dan peran — tidak pernah kredensial.

        Diatur lewat `AUTH_QUICK_LOGIN`, berisi daftar email dipisah koma dan
        **kosong secara bawaan**. Sengaja daftar email, bukan saklar on/off:
        saklar berarti sekali dinyalakan di produksi, *semua* akun jadi bisa
        dimasuki tanpa kata sandi. Di sini akun yang boleh harus disebut satu
        per satu.

        Menjawab **404** saat fitur mati — produksi tidak memberi petunjuk
        bahwa rute ini ada.
      security: []
      responses:
        "200":
          description: Daftar akun yang diizinkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AuthUser" }
        "404":
          description: Quick login tidak aktif
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Auth]
      summary: Masuk cepat tanpa kata sandi
      description: |
        Menerbitkan token biasa untuk akun yang ada di daftar izin. Tokennya
        sama persis dengan hasil `POST /auth/login` — tidak ada sesi kelas dua.

        **404** bila fitur mati, **403** bila email di luar daftar izin. Server
        mencatat peringatan saat start selama fitur ini menyala.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { title: Email, type: string, format: email }
            example: { email: "admin@bnifinance.local" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "403":
          description: Akun tidak terdaftar untuk quick login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Quick login tidak aktif, atau akunnya belum ada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Profil pengguna yang sedang masuk
      description: |
        Dibaca ulang dari database, bukan dari isi token — perubahan peran
        terlihat pada request berikutnya, bukan pada login berikutnya.
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Auth]
      summary: Ubah nama sendiri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { title: Nama, type: string, minLength: 1, example: "Budi Santoso" }
      responses:
        "200":
          description: Profil setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/password:
    put:
      tags: [Auth]
      summary: Ubah kata sandi sendiri
      description: |
        `currentPassword` **wajib**. Tanpa itu, token yang dicuri sudah cukup
        untuk mengambil alih akun secara permanen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePasswordInput" }
      responses:
        "204": { description: Berhasil, tanpa isi }
        "400":
          description: Kata sandi baru kurang dari 6 karakter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Kata sandi saat ini salah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users:
    get:
      tags: [Auth]
      summary: Daftar pengguna
      description: "**Admin saja.**"
      responses:
        "200":
          description: Daftar pengguna
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuthUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Auth]
      summary: Tambah pengguna
      description: "**Admin saja.** Peran default `user` bila tidak dikirim."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserInput" }
      responses:
        "201":
          description: Pengguna dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Email sudah terdaftar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users/{id}/role:
    patch:
      tags: [Auth]
      summary: Ubah peran pengguna
      description: |
        **Admin saja.** Menurunkan admin **terakhir** ditolak dengan 409 —
        itu keadaan yang tidak bisa dipulihkan lewat API.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { title: Peran, $ref: "#/components/schemas/UserRole" }
      responses:
        "200":
          description: Pengguna setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Ini satu-satunya admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/users/{id}/password:
    put:
      tags: [Auth]
      summary: Reset kata sandi pengguna lain
      description: |
        **Admin saja.** Tidak perlu kata sandi lama, tapi **tidak bisa dipakai
        pada diri sendiri** — untuk itu gunakan `PUT /auth/password`.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { title: Kata Sandi Baru, type: string, minLength: 6 }
      responses:
        "204": { description: Berhasil, tanpa isi }
        "400":
          description: Kata sandi terlalu pendek, atau id adalah diri sendiri
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/users/{id}:
    delete:
      tags: [Auth]
      summary: Hapus pengguna
      description: |
        **Admin saja.** Menghapus diri sendiri atau admin terakhir ditolak
        dengan 409.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Terhapus }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Akun sendiri, atau admin terakhir
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===========================================================================
  # Invoice
  # ===========================================================================
  /api/v1/invoices:
    get:
      tags: [Invoice]
      summary: Daftar invoice
      parameters:
        - name: status
          in: query
          description: |
            Salah satu status, atau `outstanding` sebagai jalan pintas untuk
            `sent` + `overdue` — sama seperti tab di UI.
          schema:
            type: string
            enum: [draft, sent, paid, overdue, cancelled, outstanding]
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/InvoiceType" }
        - name: chapterId
          in: query
          schema: { type: string }
        - name: memberId
          in: query
          schema: { type: string }
        - name: q
          in: query
          description: Pencarian pada **nomor invoice** saja (belum nama member).
          schema: { type: string }
        - name: dueFrom
          in: query
          schema: { type: string, format: date }
        - name: dueTo
          in: query
          schema: { type: string, format: date }
        - name: issuedFrom
          in: query
          description: Tanggal terbit paling awal (inklusif).
          schema: { type: string, format: date }
        - name: issuedTo
          in: query
          description: Tanggal terbit paling akhir (inklusif — mencakup seluruh hari itu).
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Halaman invoice, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Invoice]
      summary: Buat invoice
      description: |
        **Admin saja.** Status awal selalu `draft`.

        `number` dibuat otomatis (`INV-2026-013`) bila tidak dikirim, sehingga
        pemanggil tidak bisa membuat duplikat tanpa sengaja.

        Invoice dan entri audit pertamanya ditulis dalam **satu transaksi** —
        tidak ada invoice tanpa timeline.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceInput" }
      responses:
        "201":
          description: Invoice dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/invoices/{id}:
    get:
      tags: [Invoice]
      summary: Detail invoice
      parameters: [{ $ref: "#/components/parameters/InvoiceId" }]
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Invoice]
      summary: Ubah sebagian field invoice
      description: |
        **Admin saja.** Hanya field yang dikirim yang ditulis.

        **Transisi status** mengikuti siklus di UI:
        `draft → sent → paid`, dan bisa dibatalkan selama belum lunas.
        `paid` serta `cancelled` bersifat final. Lompatan seperti
        `draft → paid` ditolak **409**.

        Invoice berstatus `paid` atau `cancelled` **tidak bisa diubah** nominal
        maupun periodenya — itu catatan yang sudah tertutup.

        Setiap perubahan menulis satu baris audit di **transaksi yang sama**.
        `actorId`/`actorName` hanya melabeli baris audit itu; keduanya tidak
        disimpan pada invoice.
      parameters: [{ $ref: "#/components/parameters/InvoiceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInvoiceInput" }
            examples:
              terbitkan:
                summary: Terbitkan (draft → sent)
                value: { status: "sent", actorName: "Admin BNI" }
              batalkan:
                summary: Batalkan dengan alasan
                value: { status: "cancelled", cancelReason: "Salah member" }
      responses:
        "200":
          description: Invoice setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Transisi status tidak diizinkan, atau invoice sudah tertutup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "transisi status tidak diizinkan: draft → paid" }
    delete:
      tags: [Invoice]
      summary: Hapus invoice
      description: |
        **Admin saja.** Invoice yang sudah punya pembayaran **tidak bisa
        dihapus** — batalkan saja, supaya riwayatnya utuh.
      parameters: [{ $ref: "#/components/parameters/InvoiceId" }]
      responses:
        "204": { description: Terhapus }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Masih ada pembayaran yang menunjuk ke invoice ini
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/invoices/{id}/audit:
    get:
      tags: [Invoice]
      summary: Timeline invoice
      description: Terbaru dulu.
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Entri audit
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEntry" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Invoice]
      summary: Tambah catatan manual ke timeline
      description: |
        **Admin saja.** Hanya untuk anotasi manusia — perubahan status dicatat
        otomatis oleh sistem.
      parameters: [{ $ref: "#/components/parameters/InvoiceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAuditEntryInput" }
      responses:
        "201":
          description: Catatan ditambahkan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # Pembayaran
  # ===========================================================================
  /api/v1/payments:
    get:
      tags: [Pembayaran]
      summary: Daftar pembayaran
      parameters:
        - name: invoiceId
          in: query
          schema: { type: string, format: uuid }
        - name: method
          in: query
          schema: { type: string, example: bank_transfer }
        - name: paidFrom
          in: query
          schema: { type: string, format: date }
        - name: paidTo
          in: query
          description: Inklusif — mencakup seluruh hari itu.
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Halaman pembayaran, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Pembayaran]
      summary: Catat pembayaran
      description: |
        **Admin saja.**

        **Mencatat pembayaran = melunasi invoice.** Keduanya terjadi dalam satu
        transaksi dengan `SELECT … FOR UPDATE`, jadi mustahil ada pembayaran
        tercatat pada invoice yang masih belum lunas. Kirim
        `"settleInvoice": false` untuk hanya mencatat tanpa melunasi.

        Invoice yang sudah dibatalkan menolak pembayaran (**409**).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentInput" }
      responses:
        "201":
          description: Pembayaran tercatat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Invoice tidak ditemukan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invoice sudah dibatalkan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/payments/{id}:
    get:
      tags: [Pembayaran]
      summary: Detail pembayaran
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      responses:
        "200":
          description: Pembayaran
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Pembayaran]
      summary: Ubah sebagian field pembayaran
      description: "**Admin saja.**"
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePaymentInput" }
      responses:
        "200":
          description: Pembayaran setelah diubah
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Pembayaran]
      summary: Hapus pembayaran
      description: |
        **Admin saja.** Perhatikan: ini **tidak** mengembalikan status invoice
        dari `paid`.
      parameters: [{ $ref: "#/components/parameters/PaymentId" }]
      responses:
        "204": { description: Terhapus }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # Member
  # ===========================================================================
  /api/v1/members:
    get:
      tags: [Member]
      summary: Daftar member
      description: |
        Setiap member dibaca beserta chapter-nya (`LEFT JOIN`) — bentuknya sama
        dengan `MemberWithChapter` di frontend, jadi tidak perlu request kedua.
      parameters:
        - name: chapterId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MemberStatus" }
        - name: q
          in: query
          description: Pencarian pada nama, email, atau perusahaan.
          schema: { type: string }
        - name: renewalFrom
          in: query
          schema: { type: string, format: date }
        - name: renewalTo
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Halaman member, urut nama
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Member" }
        "400":
          description: Nilai `status` tidak dikenal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Member]
      summary: Tambah member
      description: |
        **Admin saja.** `id` opsional — database membuatkan bila kosong, yang
        tepat untuk member yang tidak berasal dari BNI VM.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMemberInput" }
      responses:
        "201":
          description: Member dibuat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400":
          description: Input tidak valid, atau `chapterId` tidak ada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`id` sudah dipakai"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

