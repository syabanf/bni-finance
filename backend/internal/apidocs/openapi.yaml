  /api/v1/webhooks/paperid:
    post:
      tags: [Paper.id]
      summary: Callback pembayaran dari Paper.id
      description: |
        **Tanpa token login.** Dokumentasi Paper.id tidak mendefinisikan tanda
        tangan, jadi URL callback yang didaftarkan di dashboard Paper.id membawa
        secret bersama (lewat `?token=…` atau header `x-paper-callback-token`)
        yang dibandingkan **constant-time** di sini. Secret yang belum
        dikonfigurasi menolak **setiap** callback, bukan menerima semuanya.

        **Idempoten**: Paper.id mengulang pengiriman, jadi callback untuk invoice
        yang sudah lunas dijawab `settled: false` tanpa baris pembayaran kedua.

        Event yang bukan `PAID` dijawab **200** dengan `settled: false`.

        Invoice dicocokkan lewat `additional_info.invoices[].uuid` (id Paper.id
        yang kita simpan), lalu fallback ke `number`.
      # Bearer global tidak berlaku: Paper.id memanggil tanpa sesi kita.
      security: []
      parameters:
        - name: token
          in: query
          required: false
          description: Secret bersama, alternatif dari header.
          schema: { type: string }
        - name: x-paper-callback-token
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperWebhook" }
      responses:
        "200":
          description: Callback diterima
          content:
            application/json:
              schema:
                type: object
                properties:
                  settled:
                    type: boolean
                    description: Apakah callback ini benar-benar melunasi invoice.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Token callback tidak valid atau belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Tidak ada invoice yang cocok dengan callback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===========================================================================
  # Sinkronisasi
  # ===========================================================================
  /api/v1/sync:
    post:
      tags: [Sinkronisasi]
      summary: Tarik member & chapter dari BNI Visitor Management
      description: |
        **Admin saja.** Satu panggilan menyegarkan **keduanya** — BNI VM tidak
        punya endpoint chapter tersendiri, jadi chapter diturunkan dari daftar
        member.

        Token diambil dari `app_settings.bni_vm_token` lebih dulu (bisa diganti
        dari halaman Pengaturan tanpa redeploy), lalu jatuh ke variabel
        lingkungan `BNI_VM_TOKEN`. Token **tidak pernah** sampai ke browser:
        seluruh proses berjalan di server.

        Seluruh snapshot ditulis dalam **satu transaksi**. Penulisan sebagian
        bisa meninggalkan member yang menunjuk chapter yang belum ada.

        **Member yang hilang dari BNI VM dinonaktifkan, bukan dihapus.**
        Menghapusnya akan melanggar foreign key begitu mereka punya invoice, dan
        membuang riwayat tagihan meski berhasil.

        **Snapshot kosong ditolak** (502). Menerapkannya akan menonaktifkan
        seluruh member — jauh lebih mungkin BNI VM sedang bermasalah daripada
        organisasi kehilangan semua anggotanya sekaligus.
      responses:
        "200":
          description: Sinkronisasi selesai
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: BNI VM tidak bisa dihubungi, menolak token, atau balasannya kosong
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Token BNI VM belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/paperid/status:
    get:
      tags: [Paper.id]
      summary: Status konfigurasi Paper.id
      description: |
        **Admin saja.** Hanya boolean dan base URL — **tidak pernah** memuat
        `client_id`, `client_secret`, maupun callback token.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured:
                    type: boolean
                    description: Kredensial Paper.id terisi.
                  baseUrl: { type: string }
                  callbackConfigured: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/paperid/test-invoice:
    post:
      tags: [Paper.id]
      summary: Konsol uji — buat invoice percobaan
      description: |
        **Admin saja.** Menyusun payload `store-invoice` dan (opsional)
        mengirimkannya, lalu mengembalikan request beserta response apa adanya.
        Berguna untuk memastikan kredensial bekerja tanpa perlu menyiapkan
        invoice dan member sungguhan.

        **`dryRun` default `true`** — payload disusun tetapi **tidak** dikirim.
        Panggilan sungguhan membuat invoice nyata di Paper.id dan memakai
        nomornya secara permanen, jadi mengirim harus menjadi pilihan sadar.

        Nomor uji selalu ber-prefix `TEST-` dengan stempel waktu + acak, sehingga
        tidak pernah menghabiskan nomor invoice sungguhan maupun bentrok satu
        sama lain.

        Konsol ini **tidak menyentuh tabel invoice** — murni uji kontrak.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperTestInvoiceInput" }
      responses:
        "200":
          description: Hasil uji (periksa `success` di dalam body)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTestInvoiceResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Paper.id belum dikonfigurasi (hanya untuk mode kirim)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/paperid/test-callback:
    post:
      tags: [Paper.id]
      summary: Konsol uji — simulasikan callback pembayaran
      description: |
        **Admin saja.** Menyusun payload callback Paper.id untuk salah satu
        invoice kita, lalu (opsional) menjalankannya lewat **handler webhook yang
        sebenarnya** — jadi yang diuji adalah jalur produksi, bukan tiruannya.
        Menunggu pembayaran sungguhan di staging tidak praktis.

        **`dryRun` default `true`.** Bila dijalankan sungguhan, invoice benar-benar
        **ditandai lunas** beserta baris pembayarannya.

        Invoice harus sudah dikirim ke Paper.id — yang masih `draft` ditolak 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperTestCallbackInput" }
      responses:
        "200":
          description: Hasil simulasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaperTestCallbackResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Invoice masih draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===========================================================================
  # Blackbox
  # ===========================================================================
  /api/v1/blackbox:
    get:
      tags: [Blackbox]
      summary: Rekaman panggilan integrasi
      description: |
        **Admin saja.** Perekam "kotak hitam": setiap panggilan **keluar** ke API
        eksternal (Paper.id, Xendit, BNI VM) dan setiap **callback masuk**
        terekam dengan body request, endpoint yang dihubungi, body response, dan
        status berhasil/gagal.

        Disimpan di **memori** sebagai ring buffer (default 200 entri, atur lewat
        `BLACKBOX_SIZE`), terbaru dulu — bukan tabel database. Ini alat
        diagnosis: hanya lalu lintas terkini yang berguna, dan menyimpannya di
        memori menghindari satu penulisan DB pada tiap panggilan integrasi.
        **Isinya hilang saat server restart** — memang disengaja.

        **Kredensial tidak pernah terekam.** Hanya body yang dicatat; `client_id`,
        `client_secret`, dan bearer token ada di header, jadi secara konstruksi
        tidak bisa masuk ke sini.
      parameters:
        - name: integration
          in: query
          description: Saring per integrasi.
          schema: { type: string, enum: [paper_id, bni_vm] }
        - name: direction
          in: query
          description: |
            `outbound` = permintaan kita ke pihak luar.
            `inbound` = callback dari pihak luar ke kita.
          schema: { type: string, enum: [outbound, inbound] }
        - name: status
          in: query
          description: Isi `failed` untuk hanya menampilkan yang gagal.
          schema: { type: string, enum: [failed] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Rekaman, terbaru dulu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BlackboxEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Blackbox]
      summary: Kosongkan rekaman
      description: "**Admin saja.**"
      responses:
        "204": { description: Rekaman dikosongkan }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ===========================================================================
  # Unggahan
  # ===========================================================================
  /api/v1/uploads:
    post:
      tags: [Unggahan]
      summary: Unggah bukti pembayaran
      description: |
        **Admin saja.** Menerima JPG, PNG, WebP, HEIC, dan PDF — allowlist,
        bukan blocklist.

        Nama berkas **dibuat server**, tidak pernah diambil dari klien: nama
        pilihan pemanggil adalah jalan menuju path traversal atau berkas
        tertimpa. Batas ukuran default 5 MB (`MAX_UPLOAD_SIZE`).

        Simpan `url` yang dikembalikan pada `proofUrl` saat mencatat pembayaran.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Berkas tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: "/uploads/20260722-5a10601f9a8e.png" }
        "400":
          description: Tipe tidak didukung, berkas kosong, atau melebihi batas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /uploads/{filename}:
    get:
      tags: [Unggahan]
      summary: Ambil berkas yang tersimpan
      description: |
        **Tanpa token.** URL sengaja dibuat tak tertebak alih-alih dijaga
        autentikasi, karena halaman bayar publik harus bisa menampilkannya
        untuk orang yang tidak punya akun. Direktori tidak bisa dijelajahi.
      security: []
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Isi berkas
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  # ===========================================================================
  # Publik
  # ===========================================================================
  # ===========================================================================
  # Sistem
  # ===========================================================================
  /metrics:
    get:
      tags: [Sistem]
      summary: Metrik Prometheus
      description: |
        Format eksposisi teks Prometheus (`version=0.0.4`), untuk di-scrape.

        **Akses.** Terbuka bila `METRICS_TOKEN` kosong; bila diisi, setiap scrape
        wajib membawa `Authorization: Bearer <token>` dan dibandingkan
        constant-time. Terbuka sebagai bawaan karena endpoint metrik yang tak
        bisa di-scrape bukan hardening melainkan hiasan — dan inventaris route
        yang ia ungkap memang sudah publik lewat `/docs` dan `/openapi.json`.
        Volume permintaan dan tingkat error tetap layak dilindungi di produksi:
        isi `METRICS_TOKEN`, atau blokir `/metrics` di ingress.

        **Yang TIDAK pernah ada di sini:** id member, nomor invoice, email,
        nominal. Label dibatasi pada pola route, method, status, mitra
        integrasi, arah, dan hasil — dijamin oleh konstruksi, bukan konfigurasi.

        **Kardinalitas.** Label `route` memakai *pola* route
        (`/api/v1/invoices/{id}`), bukan URL. URL berarti satu series per
        invoice, dan Prometheus menyimpan setiap series yang pernah dilihatnya
        di memori — lalu lintas normal akan menghabiskan heap scraper sampai
        mati. Path yang tidak cocok route mana pun dikumpulkan ke `other`.

        | Metrik | Tipe | Label |
        |---|---|---|
        | `http_requests_total` | counter | `method`, `route`, `status` |
        | `http_request_duration_seconds` | histogram | `method`, `route` |
        | `http_requests_in_flight` | gauge | — |
        | `integration_calls_total` | counter | `integration`, `direction`, `outcome` |
        | `integration_call_duration_seconds` | histogram | `integration`, `direction` |
        | `db_pool_conns_*` | gauge | — |
        | `db_pool_acquire_empty_total` | gauge | — |
        | `go_goroutines`, `go_memstats_*`, `go_gc_cycles_total` | gauge | — |
      security: []
      responses:
        "200":
          description: Metrik dalam format eksposisi teks
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: METRICS_TOKEN diisi tetapi token pada permintaan salah
          content:
            text/plain:
              schema: { type: string }

  /healthz:
    get:
      tags: [Sistem]
      summary: Cek kesehatan
      description: Tanpa autentikasi, supaya probe tidak perlu kredensial.
      security: []
      responses:
        "200":
          description: Layanan dan database siap
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { title: Status, type: string, example: ok }
        "503":
          description: Database tidak bisa dihubungi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { title: Status, type: string, example: "database tidak siap" }

  /openapi.yaml:
    get:
      tags: [Sistem]
      summary: Spesifikasi OpenAPI ini
      security: []
      responses:
        "200":
          description: Spesifikasi
          content:
            application/yaml:
              schema: { type: string }

  /openapi.json:
    get:
      tags: [Sistem]
      summary: Spesifikasi yang sama dalam bentuk JSON
      description: |
        Dihasilkan dari YAML oleh `make docs`. Halaman `/docs` merender bentuk
        ini, karena browser bisa mem-parsing JSON tanpa pustaka apa pun.
      security: []
      responses:
        "200":
          description: Spesifikasi
          content:
            application/json:
              schema: { type: object }

  /docs:
    get:
      tags: [Sistem]
      summary: Dokumentasi API yang bisa dibaca di browser
      description: |
        Halaman mandiri — seluruh CSS dan JS tertanam, jadi tetap berfungsi
        tanpa koneksi jaringan.
      security: []
      responses:
        "200":
          description: Halaman HTML
          content:
            text/html:
              schema: { type: string }

# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token dari `POST /api/v1/auth/login`.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    InvoiceId:
      name: id
      in: path
      required: true
      description: UUID invoice. Format yang salah dijawab 404, bukan 500.
      schema: { type: string, format: uuid }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ChapterId:
      name: id
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettingKey:
      name: key
      in: path
      required: true
      description: Dinormalkan menjadi huruf kecil.
      schema: { type: string, example: self_payment_mode }

  responses:
    BadRequest:
      description: Input tidak valid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token tidak disertakan, tidak valid, atau sudah kedaluwarsa
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            tanpaToken: { value: { error: "token tidak disertakan" } }
            kedaluwarsa: { value: { error: "sesi sudah berakhir — masuk kembali" } }
    Forbidden:
      description: Butuh peran admin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "butuh akses admin" }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "data tidak ditemukan" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Pesan dalam Bahasa Indonesia. }

    ListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          description: Selalu larik — tidak pernah `null`, meski kosong.
          items: {}
        meta:
          type: object
          required: [total, limit, offset]
          properties:
            total:
              type: integer
              description: Jumlah baris yang cocok dengan filter, bukan hanya halaman ini.
            limit: { type: integer }
            offset: { type: integer }

    # --- Auth ----------------------------------------------------------------
    UserRole:
      title: Peran
      type: string
      enum: [admin, user]

    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id: { title: ID, type: string, format: uuid }
        name: { title: Nama, type: string }
        email: { title: Email, type: string, format: email }
        role: { title: Peran, $ref: "#/components/schemas/UserRole" }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { title: Email, type: string, format: email }
        password: { title: Kata Sandi, type: string }

    LoginResult:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: "JWT HS256. Kirim sebagai `Authorization: Bearer <token>`."
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/AuthUser" }

    CreateUserInput:
      type: object
      required: [email, password, name]
      properties:
        email: { title: Email, type: string, format: email }
        password: { title: Kata Sandi, type: string, minLength: 6 }
        name: { title: Nama, type: string }
        role:
          title: Peran
          allOf: [{ $ref: "#/components/schemas/UserRole" }]
          default: user

    UpdatePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { title: Kata Sandi Saat Ini, type: string }
        newPassword: { title: Kata Sandi Baru, type: string, minLength: 6 }

    # --- Invoice -------------------------------------------------------------
    InvoiceType:
      title: Jenis Invoice
      type: string
      enum: [registration, renewal]

    InvoiceStatus:
      title: Status Invoice
      type: string
      enum: [draft, sent, paid, overdue, cancelled]

    Invoice:
      type: object
      required:
        [id, number, memberId, chapterId, type, amount, currency,
         dueDate, periodStart, periodEnd, status, createdAt, updatedAt]
      properties:
        id: { title: ID, type: string, format: uuid }
        number: { title: Nomor Invoice, type: string, example: INV-2026-013 }
        memberId: { title: Member, type: string }
        chapterId: { title: Chapter, type: string }
        type: { title: Jenis Invoice, $ref: "#/components/schemas/InvoiceType" }
        amount:

          title: Nominal (Rp)
          type: integer
          description: Rupiah penuh. Kolomnya `integer` — maks ~Rp 2,14 miliar per baris.
        currency: { title: Mata Uang, type: string, default: IDR }
        dueDate: { title: Jatuh Tempo, type: string, format: date }
        periodStart: { title: Periode Mulai, type: string, format: date }
        periodEnd: { title: Periode Selesai, type: string, format: date }
        status: { title: Status, $ref: "#/components/schemas/InvoiceStatus" }
        paperIdInvoiceId: { title: ID Invoice Paper.id, type: string }
        paperIdInvoiceUrl: { title: URL Invoice Paper.id, type: string }
        paperIdPaymentUrl: { title: URL Pembayaran Paper.id, type: string }
        paperIdSentAt: { title: Waktu Kirim ke Paper.id, type: string, format: date-time }
        paymentProvider: { type: string, example: xendit }
        xenditExternalId: { type: string }
        xenditPaymentId: { type: string }
        xenditPaymentMethod: { type: string, enum: [va, qris] }
        xenditVaBank: { type: string }
        xenditVaNumber: { type: string }
        xenditQrisString: { type: string }
        xenditPaymentStatus: { type: string }
        xenditExpiresAt: { type: string, format: date-time }
        paidAt: { title: Waktu Pembayaran, type: string, format: date-time }
        paidAmount: { type: integer }
        notes: { title: Catatan, type: string }
        createdBy: { title: Dibuat Oleh, type: string }
        cancelledBy: { title: Dibatalkan Oleh, type: string }
        cancelledAt: { type: string, format: date-time }
        cancelReason: { title: Alasan Pembatalan, type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateInvoiceInput:
      type: object
      required: [memberId, chapterId, type, amount, dueDate, periodStart, periodEnd]
      properties:
        number:

          title: Nomor Invoice
          type: string
          description: Dibuat otomatis bila kosong.
        memberId: { title: Member, type: string }
        chapterId: { title: Chapter, type: string }
        type: { title: Jenis Invoice, $ref: "#/components/schemas/InvoiceType" }
        amount: { title: Nominal (Rp), type: integer, minimum: 1 }
        currency: { title: Mata Uang, type: string, default: IDR }
        dueDate: { title: Jatuh Tempo, type: string, format: date }
        periodStart: { title: Periode Mulai, type: string, format: date }
        periodEnd:

          title: Periode Selesai
          type: string
          format: date
          description: Tidak boleh lebih awal dari `periodStart`.
        notes: { title: Catatan, type: string }
        createdBy: { title: Dibuat Oleh, type: string }

    UpdateInvoiceInput:
      type: object
      description: Hanya field yang dikirim yang ditulis.
      properties:
        amount: { title: Nominal (Rp), type: integer, minimum: 1 }
        dueDate: { title: Jatuh Tempo, type: string, format: date }
        periodStart: { title: Periode Mulai, type: string, format: date }
        periodEnd: { title: Periode Selesai, type: string, format: date }
        status: { title: Status, $ref: "#/components/schemas/InvoiceStatus" }
        notes: { title: Catatan, type: string }
        cancelReason: { title: Alasan Pembatalan, type: string }
        cancelledBy: { title: Dibatalkan Oleh, type: string }
        paperIdInvoiceId: { title: ID Invoice Paper.id, type: string }
        paperIdInvoiceUrl: { title: URL Invoice Paper.id, type: string }
        paperIdPaymentUrl: { title: URL Pembayaran Paper.id, type: string }
        paperIdSentAt: { title: Waktu Kirim ke Paper.id, type: string, format: date-time }
        actorId:

          title: ID Pelaku
          type: string
          description: Hanya melabeli baris audit; tidak disimpan pada invoice.
        actorName:

          title: Nama Pelaku
          type: string
          description: Hanya melabeli baris audit; tidak disimpan pada invoice.

    # --- Audit ---------------------------------------------------------------
    AuditAction:
      type: string
      enum: [created, sent, paid, cancelled, overdue, updated]

    AuditEntry:
      type: object
      required: [id, invoiceId, action, createdAt]
      properties:
        id: { title: ID, type: string, format: uuid }
        invoiceId: { title: Invoice, type: string, format: uuid }
        action: { title: Aksi, $ref: "#/components/schemas/AuditAction" }
        oldStatus: { $ref: "#/components/schemas/InvoiceStatus" }
        newStatus: { $ref: "#/components/schemas/InvoiceStatus" }
        actorId: { title: ID Pelaku, type: string }
        actorName: { title: Nama Pelaku, type: string }
        notes: { title: Catatan, type: string }
        createdAt: { type: string, format: date-time }

    CreateAuditEntryInput:
      type: object
      required: [notes]
      properties:
        action:
          title: Aksi
          allOf: [{ $ref: "#/components/schemas/AuditAction" }]
          default: updated
        actorId: { title: ID Pelaku, type: string }
        actorName: { title: Nama Pelaku, type: string }
        notes: { title: Catatan, type: string, minLength: 1 }

    # --- Pembayaran ----------------------------------------------------------
    Payment:
      type: object
      required: [id, invoiceId, amount, paidAt, createdAt]
      properties:
        id: { title: ID, type: string, format: uuid }
        invoiceId: { title: Invoice, type: string, format: uuid }
        amount: { title: Nominal (Rp), type: integer }
        paidAt: { title: Waktu Pembayaran, type: string, format: date-time }
        paymentMethod: { title: Metode Pembayaran, type: string, example: bank_transfer }
        paperIdPaymentId: { type: string }
        paperIdStatus: { type: string }
        xenditPaymentId: { type: string }
        xenditStatus: { type: string }
        proofUrl:

          title: Bukti Pembayaran (URL)
          type: string
          description: Path dari `POST /uploads`, mis. `/uploads/2026….png`.
        note: { title: Catatan, type: string }
        createdAt: { type: string, format: date-time }

    CreatePaymentInput:
      type: object
      required: [invoiceId, amount]
      properties:
        invoiceId: { title: Invoice, type: string, format: uuid }
        amount: { title: Nominal (Rp), type: integer, minimum: 1 }
        paidAt:

          title: Waktu Pembayaran
          type: string
          format: date-time
          description: Default waktu server.
        paymentMethod: { title: Metode Pembayaran, type: string }
        proofUrl: { title: Bukti Pembayaran (URL), type: string }
        note: { title: Catatan, type: string }
        settleInvoice:

          title: Sekalian Lunasi Invoice
          type: boolean
          default: true
          description: Kirim `false` untuk mencatat tanpa melunasi invoice.

    UpdatePaymentInput:
      type: object
      properties:
        amount: { title: Nominal (Rp), type: integer, minimum: 1 }
        paidAt: { title: Waktu Pembayaran, type: string, format: date-time }
        paymentMethod: { title: Metode Pembayaran, type: string }
        proofUrl: { title: Bukti Pembayaran (URL), type: string }
        note: { title: Catatan, type: string }

    # --- Member & Chapter ----------------------------------------------------
    MemberStatus:
      title: Status Member
      type: string
      enum: [active, inactive, pending]

    Chapter:
      type: object
      required: [id, name, displayName, syncedAt]
      properties:
        id: { title: ID, type: string, example: ch-garuda }
        name: { title: Nama, type: string }
        displayName: { title: Nama Tampilan, type: string }
        areaName: { title: Area, type: string }
        cityName: { title: Kota, type: string }
        syncedAt: { type: string, format: date-time }

    CreateChapterInput:
      type: object
      required: [name]
      properties:
        id:

          title: ID
          type: string
          description: Dibuatkan database bila kosong.
        name: { title: Nama, type: string, minLength: 1 }
        displayName:

          title: Nama Tampilan
          type: string
          description: Jatuh ke `name` bila kosong.
        areaName: { title: Area, type: string }
        cityName: { title: Kota, type: string }

    UpdateChapterInput:
      type: object
      properties:
        name: { title: Nama, type: string, minLength: 1 }
        displayName: { title: Nama Tampilan, type: string, minLength: 1 }
        areaName: { title: Area, type: string }
        cityName: { title: Kota, type: string }

    Member:
      type: object
      required: [id, chapterId, name, status, joinedDate, renewalDate, syncedAt]
      properties:
        id: { title: ID, type: string }
        chapterId: { title: Chapter, type: string }
        name: { title: Nama, type: string }
        email: { title: Email, type: string, format: email }
        phone: { title: Nomor Telepon, type: string }
        company: { title: Perusahaan, type: string }
        businessField: { title: Bidang Usaha, type: string }
        status: { title: Status, $ref: "#/components/schemas/MemberStatus" }
        joinedDate: { title: Tanggal Bergabung, type: [string, "null"], format: date }
        renewalDate: { title: Tanggal Perpanjangan, type: [string, "null"], format: date }
        syncedAt: { type: string, format: date-time }
        chapter:
          allOf: [{ $ref: "#/components/schemas/Chapter" }]
          description: Diisi lewat LEFT JOIN, jadi tidak perlu request kedua.

    RenewalDueMember:
      allOf:
        - $ref: "#/components/schemas/Member"
        - type: object
          required: [daysUntilDue]
          properties:
            daysUntilDue:
              type: integer
              description: Sisa hari sampai keanggotaan berakhir.

    CreateMemberInput:
      type: object
      required: [chapterId, name]
      properties:
        id:

          title: ID
          type: string
          description: Dibuatkan database bila kosong.
        chapterId: { title: Chapter, type: string }
        name: { title: Nama, type: string, minLength: 1 }
        email: { title: Email, type: string, format: email }
        phone: { title: Nomor Telepon, type: string }
        company: { title: Perusahaan, type: string }
        businessField: { title: Bidang Usaha, type: string }
        status:
          title: Status
          allOf: [{ $ref: "#/components/schemas/MemberStatus" }]
          default: active
        joinedDate: { title: Tanggal Bergabung, type: string, format: date }
        renewalDate: { title: Tanggal Perpanjangan, type: string, format: date }

    UpdateMemberInput:
      type: object
      properties:
        chapterId: { title: Chapter, type: string }
        name: { title: Nama, type: string, minLength: 1 }
        email: { title: Email, type: string }
        phone: { title: Nomor Telepon, type: string }
        company: { title: Perusahaan, type: string }
        businessField: { title: Bidang Usaha, type: string }
        status: { title: Status, $ref: "#/components/schemas/MemberStatus" }
        joinedDate: { title: Tanggal Bergabung, type: string, format: date }
        renewalDate: { title: Tanggal Perpanjangan, type: string, format: date }

    # --- Pengaturan ----------------------------------------------------------
    FeeSettings:
      type: object
      required: [id, registrationFee, renewalFee, currency, updatedAt, createdAt]
      properties:
        id: { title: ID, type: string, default: "default" }
        registrationFee: { title: Biaya Pendaftaran, type: integer }
        renewalFee: { title: Biaya Perpanjangan, type: integer }
        currency: { title: Mata Uang, type: string, default: IDR }
        notes: { title: Catatan, type: string }
        updatedBy: { title: Diubah Oleh, type: string }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    UpdateFeeSettingsInput:
      type: object
      description: Minimal satu field harus dikirim.
      properties:
        registrationFee: { title: Biaya Pendaftaran, type: integer, minimum: 0 }
        renewalFee: { title: Biaya Perpanjangan, type: integer, minimum: 0 }
        currency: { title: Mata Uang, type: string, minLength: 1 }
        notes: { title: Catatan, type: string }
        updatedBy: { title: Diubah Oleh, type: string }

    AppSetting:
      type: object
      required: [key, value]
      properties:
        key: { type: string, example: self_payment_mode }
        value: { title: Nilai, type: string }
        updatedAt: { type: string, format: date-time }
        masked:
          type: boolean
          description: |
            `true` bila `value` disamarkan menjadi `••••••` karena nama key-nya
            mengandung `token`, `secret`, `password`, `apikey`, `credential`,
            atau `private`. Nilai aslinya tetap utuh di database — hanya jalur
            keluarnya yang ditutup, jadi key semacam itu bersifat write-only
            lewat API ini.

    # --- Dashboard -----------------------------------------------------------
    AmountBucket:
      type: object
      required: [count, amount, trend]
      properties:
        count: { type: integer }
        amount: { title: Nominal (Rp), type: integer }
        trend:
          type: number
          format: double
          description: Persen perubahan terhadap 30 hari sebelumnya.

    CountBucket:
      type: object
      required: [count, trend]
      properties:
        count: { type: integer }
        trend: { type: number, format: double }

    DashboardSummary:
      type: object
      required:
        [total, paid, outstanding, overdue, renewalDue,
         statusBreakdown, monthly, chapterStats]
      properties:
        total:
          allOf: [{ $ref: "#/components/schemas/AmountBucket" }]
          description: Seluruh invoice kecuali yang dibatalkan.
        paid: { $ref: "#/components/schemas/AmountBucket" }
        outstanding:
          allOf: [{ $ref: "#/components/schemas/AmountBucket" }]
          description: Sudah terbit tapi belum dibayar (`sent` + `overdue`).
        overdue: { $ref: "#/components/schemas/AmountBucket" }
        renewalDue: { $ref: "#/components/schemas/CountBucket" }
        statusBreakdown:
          type: array
          items:
            type: object
            properties:
              status: { title: Status, $ref: "#/components/schemas/InvoiceStatus" }
              count: { type: integer }
        monthly:
          type: array
          description: Termasuk bulan kosong, supaya jeda tidak hilang dari grafik.
          items:
            type: object
            properties:
              month: { type: string, example: "2026-07" }
              issued: { type: integer }
              paid: { type: integer }
        chapterStats:
          type: array
          description: Chapter tanpa invoice tetap muncul.
          items:
            type: object
            properties:
              chapterId: { type: string }
              chapterName: { type: string }
              total: { type: integer }
              paid: { type: integer }
              outstanding: { type: integer }
              overdue: { type: integer }
              totalAmount: { type: integer }

    # --- Publik --------------------------------------------------------------
    PublicInvoice:
      type: object
      description: |
        Proyeksi sempit untuk halaman bayar. **Tidak memuat** email, telepon,
        perusahaan, atau bidang usaha member.
      required:
        [id, number, type, amount, currency, status,
         dueDate, periodStart, periodEnd, memberName, createdAt]
      properties:
        id: { title: ID, type: string, format: uuid }
        number: { title: Nomor Invoice, type: string }
        type: { title: Jenis Invoice, $ref: "#/components/schemas/InvoiceType" }
        amount: { title: Nominal (Rp), type: integer }
        currency: { title: Mata Uang, type: string }
        status: { title: Status, $ref: "#/components/schemas/InvoiceStatus" }
        dueDate: { title: Jatuh Tempo, type: string, format: date }
        periodStart: { title: Periode Mulai, type: string, format: date }
        periodEnd: { title: Periode Selesai, type: string, format: date }
        memberName: { type: string }
        chapterName: { type: string }
        notes: { title: Catatan, type: string }
        paymentProvider: { type: string }
        paperIdPaymentUrl: { title: URL Pembayaran Paper.id, type: string }
        xenditPaymentMethod: { type: string, enum: [va, qris] }
        xenditVaBank: { type: string }
        xenditVaNumber: { type: string }
        xenditQrisString: { type: string }
        xenditPaymentStatus: { type: string }
        xenditExpiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PublicInvoiceView:
      type: object
      required: [invoice, selfPaymentMode]
      properties:
        invoice: { $ref: "#/components/schemas/PublicInvoice" }
    PaymentResult:
      type: object
      required: [method, amount]
      properties:
        method: { title: Metode, type: string, enum: [va, qris] }
        bank: { title: Bank, type: string }
        vaNumber: { type: string }
        qrString: { type: string }
        amount: { title: Nominal (Rp), type: integer }
        expiresAt: { type: [string, "null"], format: date-time }

    PaperTestInvoiceInput:
      type: object
      description: Semua field opsional — kosongkan untuk memakai data contoh.
      properties:
        customerName:
          title: Nama Penerima
          type: string
          default: Uji Coba BNI Finance
          description: Nama penerima invoice.
        customerPhone:
          title: Nomor Telepon
          type: string
          default: "081200000000"
          description: >-
            Nomor telepon penerima — Paper.id mewajibkannya. Bawaannya nomor
            contoh, bukan nomor sungguhan, supaya uji coba tidak pernah
            mengirim pesan ke orang lain tanpa sengaja.
        customerEmail:
          title: Email Penerima
          type: string
          description: Alamat email penerima. Boleh kosong bila tidak mengirim email.
        amount:

          title: Nominal (Rp)
          title: Nominal (Rp)
          type: integer
          default: 1500000
          description: Nominal tagihan dalam rupiah, tanpa titik.
        itemName:
          title: Nama Item
          type: string
          default: Uji Koneksi Paper.id
          description: Nama barang/jasa yang tercetak pada invoice.
        notes:

          title: Catatan
          title: Catatan
          type: string
          description: Catatan tambahan yang ikut tercetak di invoice.
        sendEmail:
          title: Kirim via Email

          title: Kirim via Email
          title: Kirim via Email
          type: boolean
          default: false
          description: Minta Paper.id mengirim invoice ke email di atas.
        sendWhatsApp:
          title: Kirim via WhatsApp

          title: Kirim via WhatsApp
          title: Kirim via WhatsApp
          type: boolean
          default: false
          description: Minta Paper.id mengirim tautan pembayaran via WhatsApp.
        dryRun:
          title: Mode Uji (tidak benar-benar dikirim)
          type: boolean
          default: true
          description: >-
            Aktif = payload hanya disusun dan ditampilkan, tidak dikirim ke
            Paper.id. Matikan hanya bila memang ingin membuat invoice sungguhan.

    PaperTestInvoiceResult:
      type: object
      required: [dryRun, method, url, request, success]
      properties:
        dryRun: { type: boolean }
        method: { title: Metode, type: string }
        url: { type: string }
        request:
          description: Payload persis seperti yang dikirim ke Paper.id.
        response:
          description: Balasan Paper.id. Kosong saat `dryRun`.
        success:
          type: boolean
          description: Saat `dryRun`, artinya payload berhasil disusun — bukan diterima upstream.
        durationMs: { type: integer }
        error: { type: string }
        paperInvoiceId: { type: string }
        number: { title: Nomor Invoice, type: string }
        paymentUrl: { type: string }
        invoicePdfUrl: { type: string }

    PaperTestCallbackInput:
      type: object
      required: [invoiceId]
      properties:
        invoiceId:

          title: Invoice
          title: Invoice yang Dilunasi
          type: string
          format: uuid
          description: Invoice kita yang mau dianggap lunas. Harus sudah dikirim ke Paper.id.
        amount:

          title: Nominal (Rp)
          title: Nominal Dibayar (Rp)
          type: integer
          description: Nominal yang dibayar. Kosong = mengikuti nominal invoice.
        method:
          title: Metode

          title: Metode
          title: Cara Bayar
          type: string
          default: bank_transfer
          description: Cara pembayaran yang dilaporkan Paper.id.
        channel:
          title: Bank / Kanal
          type: string
          default: bni
          description: Bank atau kanal pembayarannya.
        status:
          title: Status

          title: Status
          title: Status Pembayaran
          type: string
          default: PAID
          description: Status pembayaran. Selain PAID akan diabaikan handler.
        dryRun:
          title: Mode Uji (tidak melunasi)
          type: boolean
          default: true
          description: >-
            Aktif = payload hanya disusun, invoice tidak dilunasi. Matikan hanya
            bila memang ingin menandai invoice ini lunas.

    PaperTestCallbackResult:
      type: object
      required: [dryRun, url, request, success]
      properties:
        dryRun: { type: boolean }
        url: { type: string }
        request: { description: Payload callback yang disusun. }
        settled: { type: boolean }
        success: { type: boolean }
        error: { type: string }

    BlackboxEntry:
      type: object
      required: [id, time, integration, direction, method, url, status, success, durationMs]
      properties:
        id: { title: ID, type: string }
        time: { type: string, format: date-time }
        integration: { type: string, enum: [paper_id, bni_vm] }
        direction:
          type: string
          enum: [outbound, inbound]
          description: "`outbound` = kita → pihak luar; `inbound` = pihak luar → kita."
        method: { title: Metode, type: string, example: POST }
        url:
          type: string
          description: Endpoint yang dihubungi (atau path callback kita, untuk inbound).
        request:
          description: Body permintaan sebagai JSON. String bila upstream membalas non-JSON.
        response:
          description: Body balasan sebagai JSON. String bila upstream membalas non-JSON.
        status: { title: Status, type: integer, example: 201 }
        success: { type: boolean }
        durationMs: { type: integer }
        error:
          type: string
          description: Terisi bila panggilan gagal sebelum dapat balasan (mis. timeout).

    PaperWebhook:
      type: object
      description: Payload callback pembayaran Paper.id.
      properties:
        ref_id: { title: Ref ID, type: string }
        external_id: { title: External ID, type: string }
        payment_date: { title: Tanggal Pembayaran, type: string, example: "2026-07-27" }
        payment_info:
          title: Info Pembayaran
          type: object
          properties:
            method: { title: Metode, type: string, example: bank_transfer }
            channel: { type: string, example: bni }
            amount: { type: number }
            paid_amount: { type: number }
            paid_at: { type: string }
            status: { title: Status, type: string, example: PAID }
        additional_info:
          title: Info Tambahan
          type: object
          properties:
            invoices:
              type: array
              items:
                type: object
                properties:
                  uuid: { type: string }
                  number: { type: string }

    SyncResult:
      type: object
      required: [chapters, members, deactivated, syncedAt]
      properties:
        chapters:
          type: integer
          description: Chapter unik yang ditemukan pada snapshot.
        members:
          type: integer
          description: Member yang diterima dari BNI VM.
        deactivated:
          type: integer
          description: |
            Member lokal yang tidak lagi ada di BNI VM, jadi statusnya diubah
            menjadi `inactive`. Tidak ada yang dihapus.
        syncedAt: { type: string, format: date-time }

    XenditWebhook:
      type: object
      description: |
        Xendit mengirim dua bentuk: callback VA memakai `external_id`,
        callback QR memakai `reference_id`. Keduanya diterima.
      properties:
        external_id: { title: External ID, type: string }
        reference_id: { title: Reference ID, type: string }
        id: { title: ID, type: string }
        payment_id: { title: ID Pembayaran, type: string }
        amount: { title: Nominal (Rp), type: integer }
        status: { title: Status, type: string, example: PAID }
        created: { title: Waktu Dibuat, type: string, format: date-time }
