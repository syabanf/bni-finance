  /api/v1/app-settings:
    get:
      tags: [Pengaturan]
      summary: Semua konfigurasi key/value
      description: |
        Nilai yang namanya berbau kredensial **selalu tersamar** — lihat
        `AppSetting.masked`.

        Kunci yang dipakai sistem:

        | Kunci | Arti | Bawaan |
        |---|---|---|
        | `self_payment_mode` | `true` → pembayaran lewat Xendit, Paper.id tidak dipanggil | `false` |
        | `invoice_draft_days_before` | Invoice renewal disusun N hari sebelum periode berakhir | `30` |
        | `invoice_due_days_after` | Jatuh tempo = tanggal terbit + N hari | `30` |
        | `paperid_send_email` | Paper.id mengantar invoice via email saat Terbitkan | `true` |
        | `paperid_send_whatsapp` | Paper.id mengantar invoice via WhatsApp saat Terbitkan | `true` |
        | `bni_vm_token` | Token sinkronisasi BNI VM (tersamar) | — |

        Untuk kunci `paperid_send_*`, hanya nilai `false` yang mematikan —
        baris yang belum ada tetap berarti mengantar. Untuk `self_payment_mode`
        sebaliknya: hanya `true` yang mengaktifkan.
      responses:
        "200":
          description: Konfigurasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AppSetting" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/app-settings/{key}:
    get:
      tags: [Pengaturan]
      summary: Satu konfigurasi
      parameters: [{ $ref: "#/components/parameters/SettingKey" }]
      responses:
        "200":
          description: Konfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSetting" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Pengaturan]
      summary: Simpan konfigurasi (upsert)
      description: |
        **Admin saja.** Tabel ini adalah sumber kebenaran untuk feature flag
        seperti `self_payment_mode`, jadi penulisan tidak bergantung pada
        barisnya sudah ada atau belum.

        Mengirim balik nilai tersamar (`••••••`) ditolak **400**, supaya tidak
        ada yang menimpa kredensial asli dengan tanda bintang.
      parameters: [{ $ref: "#/components/parameters/SettingKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { title: Nilai, type: string }
            example: { value: "true" }
      responses:
        "200":
          description: Konfigurasi setelah disimpan (tersamar bila rahasia)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSetting" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Pengaturan]
      summary: Hapus konfigurasi
      description: "**Admin saja.**"
      parameters: [{ $ref: "#/components/parameters/SettingKey" }]
      responses:
        "204": { description: Terhapus }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

