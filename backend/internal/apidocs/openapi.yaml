              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Token callback salah atau belum dikonfigurasi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/webhooks/paperid/supplier-payment:
    post:
      tags: [Paper.id]
      summary: Callback pembayaran ke supplier
      description: |
        Kejadian Paper.id yang tidak menyentuh penagihan keanggotaan. Direkam ke
        blackbox lalu diakui dengan 200.
        
        Menolaknya akan membuat Paper.id mengulang-ulang pengiriman untuk kejadian yang
        memang bukan urusan sistem ini, dan rekamannya tetap berguna bila suatu saat
        dipakai.
