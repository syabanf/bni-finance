# Satu origin untuk frontend dan API.
#
# Kebijakan cache:
#   /assets/         nama berkas memuat hash isi, jadi aman disimpan setahun
#   /video-panduan/  berubah hanya saat direkam ulang, disimpan seminggu
#   lainnya          index.html, sw.js, manifest: selalu divalidasi ulang,
#                    supaya rilis baru langsung terpakai
#   /api/            no-store dari backend; data keuangan per pengguna
#
# Semua jalur backend diteruskan ke `lb`, yang membagi beban ke replika API.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Impor laporan dibatasi 10 MB di backend; sisanya ruang untuk multipart.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/manifest+json;

    location /api/ {
        proxy_pass http://lb:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Kirim massal ke Paper.id dan impor bisa memakan waktu lebih dari 60 detik.
        proxy_read_timeout 180s;
    }

    location /uploads/ {
        proxy_pass http://lb:8080;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://lb:8080;
    }

    location ~ ^/(docs|openapi\.(json|yaml))$ {
        proxy_pass http://lb:8080;
    }

    location /assets/ {
        include /etc/nginx/snippets/keamanan.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /video-panduan/ {
        include /etc/nginx/snippets/keamanan.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/keamanan.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
