# Load balancer di depan seluruh replika API.
#
# `web` meneruskan /api ke sini, dan port API_PORT di host juga menunjuk ke sini,
# jadi reverse proxy produksi yang sudah mengarah ke :8080 tidak perlu diubah.
#
# `server api:8080 resolve` membaca ulang DNS Docker setiap 10 detik. Tanpa
# `resolve`, nginx hanya membaca alamat replika sekali saat start: replika yang
# dibuat ulang mendapat IP baru dan tidak pernah menerima permintaan, sementara
# IP lamanya terus dicoba dan gagal.

resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080;
    server_tokens off;

    # Sama dengan web: impor laporan 10 MB ditambah ruang multipart.
    client_max_body_size 12m;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Kirim massal ke Paper.id dan impor bisa memakan waktu lebih dari 60 detik.
        proxy_read_timeout 180s;
        # Menyambung ke replika di jaringan yang sama butuh milidetik. Bawaan 60
        # detik membuat permintaan menggantung di replika yang baru dimatikan
        # sebelum nginx mencoba replika lain; diuji dengan docker stop, itu
        # muncul sebagai 504.
        proxy_connect_timeout 2s;

        # Replika yang mati atau sedang restart dilewati ke replika berikutnya.
        # nginx tidak pernah mengulang POST, PATCH, atau DELETE ke replika lain
        # (non_idempotent tidak dinyalakan): mengulang "kirim invoice" atau
        # "catat pembayaran" yang ternyata sudah diproses berarti tagihan ganda.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
